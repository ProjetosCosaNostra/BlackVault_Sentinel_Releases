name: ONP V40 Android Recovery Build

on:
  push:
    branches: [ "onp-recovery-v40-build" ]
  workflow_dispatch:

jobs:
  build-and-launch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Fetch sharp V40 screens
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/onp-assets onp_v40/app/src/main/res/drawable-nodpi
          curl -L --fail --retry 3 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-8bb4-81f5-8175-746caa7a2ab2/raw?se=2026-09-21T03%3A24%3A36Z&sp=r&sv=2026-02-06&sr=b&scid=edf859c0-4794-556b-916d-96a03d4db531&skoid=78501c7f-f65d-4e8d-9110-bed29e1beb41&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-20T20%3A33%3A48Z&ske=2026-09-21T20%3A33%3A48Z&sks=b&skv=2026-02-06&sig=2wVsLYD%2Bw6gdXBOjnJCcxUCcLNGRU5tys7ypoXs44fU%3D' -o /tmp/onp-assets/screens.zip
          echo "0bb9b17688b77b6eb9679951607c0a6bd5cbec1cc518c3f4a8ce4c1a8f0b68c2  /tmp/onp-assets/screens.zip" | sha256sum -c -
          unzip -o /tmp/onp-assets/screens.zip -d onp_v40/app/src/main/res/drawable-nodpi
          test "$(find onp_v40/app/src/main/res/drawable-nodpi -name 'screen_*.jpg' | wc -l)" -eq 11

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          sdkmanager --list_installed | grep -E 'platforms;android-35|build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build V40 APK
        working-directory: onp_v40
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ORCAMENTO-NO-PONTO-V40-RECOVERY
          path: onp_v40/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Start cloud Android session
        continue-on-error: true
        run: |
          npx --yes ramus-cli@0.1.12 trial
          npx --yes ramus-cli@0.1.12 session start --apk onp_v40/app/build/outputs/apk/debug/app-debug.apk --wait | tee ramus-session-v40.txt
          cat ramus-session-v40.txt >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ONP-V40-runtime-receipt
          path: ramus-session-v40.txt
