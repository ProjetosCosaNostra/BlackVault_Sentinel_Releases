name: ONP Cloud Emulator V37
on:
  push:
    branches:
      - onp-cloud-emulator-v37

jobs:
  build-and-launch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Fetch visual assets
        shell: bash
        run: |
          mkdir -p app/src/main/assets
          curl -L --fail --retry 3 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-2e18-81f5-a4fc-f77ccf7fed7c/raw?se=2026-09-21T02%3A20%3A59Z&sp=r&sv=2026-02-06&sr=b&scid=3584e89f-b26a-5f69-bef9-57da8107afc1&skoid=78501c7f-f65d-4e8d-9110-bed29e1beb41&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-20T19%3A52%3A17Z&ske=2026-09-21T19%3A52%3A17Z&sks=b&skv=2026-02-06&sig=ZcqD31nxivzR3%2Bsx1wwqhDEKrDpZcU3CDkyWAo2kVvM%3D' -o app/src/main/assets/main.webp
          curl -L --fail --retry 3 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-6250-81f5-9566-7e0747846ba0/raw?se=2026-09-21T02%3A20%3A59Z&sp=r&sv=2026-02-06&sr=b&scid=12f4c3bd-0deb-5b6e-83d4-ba1be57a4e97&skoid=78501c7f-f65d-4e8d-9110-bed29e1beb41&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-20T13%3A37%3A52Z&ske=2026-09-21T13%3A37%3A52Z&sks=b&skv=2026-02-06&sig=rbnFTmHQ%2BC6/yFTVj8MMLlG%2BjobzK17JV8Z5mPnSoWg%3D' -o app/src/main/assets/channels.webp
          test -s app/src/main/assets/main.webp
          test -s app/src/main/assets/channels.webp

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35 SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ONP-V37-cloud-preview-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Start Ramus cloud Android emulator
        shell: bash
        run: |
          npx --yes ramus-cli@0.1.12 trial
          npx --yes ramus-cli@0.1.12 session start --apk app/build/outputs/apk/debug/app-debug.apk --wait | tee ramus-session.txt
          echo "### Ramus live emulator" >> "$GITHUB_STEP_SUMMARY"
          cat ramus-session.txt >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ramus-session
          path: ramus-session.txt
