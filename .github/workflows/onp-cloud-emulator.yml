name: ONP Cloud Emulator V37
on:
  push:
    branches:
      - onp-cloud-emulator-v37

jobs:
  build-and-launch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Fetch visual assets
        shell: bash
        run: |
          mkdir -p app/src/main/assets
          curl -L --fail --retry 3 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-ff54-81f5-a204-bdf06c0c24f6/raw?se=2026-09-21T02%3A20%3A08Z&sp=r&sv=2026-02-06&sr=b&scid=6cd922b9-79b3-5fae-961c-dc62f2a81652&skoid=78501c7f-f65d-4e8d-9110-bed29e1beb41&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-21T00%3A46%3A17Z&ske=2026-09-22T00%3A46%3A17Z&sks=b&skv=2026-02-06&sig=Z36GwinksedI6ujx4YgzpFfax9rVghsK%2BjGIHF8eHvY%3D' -o app/src/main/assets/main.webp
          curl -L --fail --retry 3 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-0468-81f5-816d-ad5e4bd0a7c6/raw?se=2026-09-21T02%3A20%3A08Z&sp=r&sv=2026-02-06&sr=b&scid=c514cae5-0f49-5873-861a-87be6fdd2800&skoid=78501c7f-f65d-4e8d-9110-bed29e1beb41&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-20T10%3A25%3A15Z&ske=2026-09-21T10%3A25%3A15Z&sks=b&skv=2026-02-06&sig=ANED%2BFB7WxVxjcwRB10GvM%2BbAJ4B1KJLFYdyr5bNuwM%3D' -o app/src/main/assets/channels.webp
          test -s app/src/main/assets/main.webp
          test -s app/src/main/assets/channels.webp
          file app/src/main/assets/main.webp
          file app/src/main/assets/channels.webp

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK diagnostics
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          which sdkmanager || true
          sdkmanager --version || true

      - name: Install Android 35 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ONP-V37-cloud-preview-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Start Ramus cloud Android emulator
        shell: bash
        run: |
          npx --yes ramus-cli@0.1.12 trial
          npx --yes ramus-cli@0.1.12 session start --apk app/build/outputs/apk/debug/app-debug.apk --wait | tee ramus-session.txt
          echo "### Ramus live emulator" >> "$GITHUB_STEP_SUMMARY"
          cat ramus-session.txt >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ramus-session
          path: ramus-session.txt
